server:
  port: 80

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/auth/**

            - id: game-catalog
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/juegos/**

            - id: wallet-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/wallet/**

            - id: review-service
              uri: http://localhost:8089
              predicates:
                - Path=/api/v1/reviews/**

            - id: inventory-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/inventory/**

            - id: payment-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/payments/**

            - id: support-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/support/**
            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/orders/**

            - id: key-delivery
              uri: http://localhost:8087
              predicates:
                - Path=/api/v1/deliveries/**

            - id: seller-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/v1/sellers/**

app:
  jwt:
    secret: VGhpcy1Jcy1BLVZlcnktU2VjdXJlLVNlY3JldC1LZXktRm9yLUpXVC1BcGktQXV0aGVudGljYXRpb24=

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet.function: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
    org.springframework.cloud.gateway.server.webmvc: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/