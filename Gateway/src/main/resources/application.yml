server:
  port: 80

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/auth/**

            - id: game-catalog
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/juegos/**

            - id: wallet-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/wallet/**
              filters:
                - jwtFilter

            - id: review-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/reviews/**

            - id: support-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/support/**
              filters:
                - jwtFilter

app:
  jwt:
    secret: VGhpcy1Jcy1BLVZlcnktU2VjdXJlLVNlY3JldC1LZXktRm9yLUpXVC1BcGktQXV0aGVudGljYXRpb24=

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.servlet.function: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
    org.springframework.cloud.gateway.server.webmvc: TRACE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/